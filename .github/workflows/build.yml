# Builds standalone ServiceSPL apps (no Python needed on the target machine)
# on every push to main, and publishes them to the "latest" GitHub release.
name: Build apps

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

# One build per branch at a time: a newer push cancels the older run, so two runs never
# delete and re-create the same release at once (that race made a release job fail).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub's Apple Silicon build machines are not available to this account
  # (jobs are never picked up), so build a Universal app (runs natively on
  # Apple Silicon AND on Intel) on an Intel machine. numpy/scipy only ship
  # single-arch wheels, so the Intel and Apple Silicon wheels are fused.
  mac-universal:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install universal2 Python from python.org
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python-3.12.10-macos11.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv venv
          venv/bin/python -c "import platform;print(platform.machine())"
          lipo -archs venv/bin/python
      - name: Fuse Intel + Apple Silicon wheels
        run: |
          . venv/bin/activate
          pip install --upgrade pip delocate
          pip download numpy scipy cffi --no-deps --only-binary=:all: --platform macosx_12_0_x86_64 -d whl_x86
          NV=$(ls whl_x86 | sed -n 's/^numpy-\([^-]*\)-.*/\1/p')
          SV=$(ls whl_x86 | sed -n 's/^scipy-\([^-]*\)-.*/\1/p')
          CV=$(ls whl_x86 | sed -n 's/^cffi-\([^-]*\)-.*/\1/p')
          pip download numpy==$NV scipy==$SV cffi==$CV --no-deps --only-binary=:all: --platform macosx_12_0_arm64 -d whl_arm
          ls whl_x86 whl_arm
          for p in numpy scipy cffi; do delocate-merge whl_x86/$p-*.whl whl_arm/$p-*.whl -w fused; done
          ls fused
          pip install fused/*.whl
          pip install PySide6 sounddevice pyinstaller pyobjc-core pyobjc-framework-Cocoa certifi
      - name: Self-test (IEC 61672 + engine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          . venv/bin/activate
          python tests/test_iec61672.py
          python tests/test_engine.py
      - name: Build Universal .app
        run: |
          . venv/bin/activate
          pyinstaller --noconfirm --windowed --name "ServiceSPL" \
            --target-arch universal2 \
            --osx-bundle-identifier com.servicespl.app \
            --collect-data _sounddevice_data \
            --collect-data certifi \
            --icon assets/ServiceSPL.icns \
            spl_monitor.py
          APP="dist/ServiceSPL.app"
          PL="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'ServiceSPL measures sound level from your microphone.'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'ServiceSPL measures sound level from your microphone.'" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PL" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "--- architecture check (every binary must list arm64) ---"
          lipo -archs "$APP/Contents/MacOS/ServiceSPL"
          bad=0
          while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              a=$(lipo -archs "$f"); case "$a" in *arm64*) ;; *) echo "NO arm64: $f ($a)"; bad=1;; esac
            fi
          done < <(find "$APP" -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \))
          [ $bad = 0 ] || exit 1
          echo "--- HTTPS check (Planning Center needs a CA bundle inside the app) ---"
          "$APP/Contents/MacOS/ServiceSPL" --check-https
          ditto -c -k --keepParent "$APP" "ServiceSPL-Mac-AppleSilicon.zip"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname ServiceSPL -srcfolder dmg -ov -format UDZO "ServiceSPL-Mac-AppleSilicon.dmg"
      - uses: actions/upload-artifact@v5
        with:
          name: ServiceSPL-Mac-AppleSilicon
          path: |
            ServiceSPL-Mac-AppleSilicon.zip
            ServiceSPL-Mac-AppleSilicon.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy PySide6 sounddevice pyinstaller certifi
      - name: Build .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ServiceSPL --icon assets/ServiceSPL.ico --collect-data _sounddevice_data --collect-data certifi spl_monitor.py
          Compress-Archive -Path dist\ServiceSPL.exe -DestinationPath ServiceSPL-Windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: ServiceSPL-Windows
          path: ServiceSPL-Windows.zip

  release:
    needs: [mac-universal, windows]
        # main -> "latest" release; any other branch -> "preview" pre-release (for testing before merge).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true
      - name: Publish to the "latest" release
        if: ${{ hashFiles('out/*.zip') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=latest; TITLE="ServiceSPL (latest build)"; PRE=""
          else
            TAG=preview; TITLE="ServiceSPL PREVIEW (branch $GITHUB_REF_NAME)"; PRE="--prerelease"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" $(ls out/*.zip out/*.dmg 2>/dev/null) --title "$TITLE" $PRE --target "$GITHUB_SHA" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $GITHUB_REF_NAME. Mac (Apple Silicon): download ServiceSPL-Mac-AppleSilicon.dmg, open it and drag ServiceSPL to Applications. The same app is also in the .zip. Windows: ServiceSPL-Windows.zip."
