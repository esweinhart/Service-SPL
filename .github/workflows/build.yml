# Builds standalone SPL Monitor apps (no Python needed on the target machine)
# on every push to main, and publishes them to the "latest" GitHub release.
name: Build apps

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel    # Intel Macs
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy PySide6 sounddevice pyinstaller pyobjc-core pyobjc-framework-Cocoa
      - name: Self-test (IEC 61672 + engine)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_iec61672.py
          python tests/test_engine.py
      - name: Build .app
        run: |
          pyinstaller --noconfirm --windowed --name "SPL Monitor" \
            --osx-bundle-identifier com.splmonitor.app \
            --collect-data _sounddevice_data \
            spl_monitor.py
          APP="dist/SPL Monitor.app"
          PL="$APP/Contents/Info.plist"
          # Without this key macOS hands the app silence instead of the mic.
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'SPL Monitor measures sound level from your microphone.'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'SPL Monitor measures sound level from your microphone.'" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PL" || true
          # Ad-hoc sign (free, no Apple developer account) so the mic permission sticks.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "SPL-Monitor-Mac-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: SPL-Monitor-Mac-${{ matrix.arch }}
          path: SPL-Monitor-Mac-${{ matrix.arch }}.zip

  # GitHub's Apple Silicon build machines are not available to this account
  # (jobs are never picked up), so build a Universal app (runs natively on
  # Apple Silicon AND on Intel) on an Intel machine. numpy/scipy only ship
  # single-arch wheels, so the Intel and Apple Silicon wheels are fused.
  mac-universal:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install universal2 Python from python.org
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python-3.12.10-macos11.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv venv
          venv/bin/python -c "import platform;print(platform.machine())"
          lipo -archs venv/bin/python
      - name: Fuse Intel + Apple Silicon wheels
        run: |
          . venv/bin/activate
          pip install --upgrade pip delocate
          pip download numpy scipy cffi --no-deps --only-binary=:all: --platform macosx_12_0_x86_64 -d whl_x86
          NV=$(ls whl_x86 | sed -n 's/^numpy-\([^-]*\)-.*/\1/p')
          SV=$(ls whl_x86 | sed -n 's/^scipy-\([^-]*\)-.*/\1/p')
          CV=$(ls whl_x86 | sed -n 's/^cffi-\([^-]*\)-.*/\1/p')
          pip download numpy==$NV scipy==$SV cffi==$CV --no-deps --only-binary=:all: --platform macosx_12_0_arm64 -d whl_arm
          ls whl_x86 whl_arm
          for p in numpy scipy cffi; do delocate-merge whl_x86/$p-*.whl whl_arm/$p-*.whl -w fused; done
          ls fused
          pip install fused/*.whl
          pip install PySide6 sounddevice pyinstaller pyobjc-core pyobjc-framework-Cocoa
      - name: Build Universal .app
        run: |
          . venv/bin/activate
          pyinstaller --noconfirm --windowed --name "SPL Monitor" \
            --target-arch universal2 \
            --osx-bundle-identifier com.splmonitor.app \
            --collect-data _sounddevice_data \
            spl_monitor.py
          APP="dist/SPL Monitor.app"
          PL="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'SPL Monitor measures sound level from your microphone.'" "$PL" \
            || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'SPL Monitor measures sound level from your microphone.'" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PL" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "--- architecture check (every binary must list arm64) ---"
          lipo -archs "$APP/Contents/MacOS/SPL Monitor"
          bad=0
          while IFS= read -r f; do
            if file "$f" | grep -q "Mach-O"; then
              a=$(lipo -archs "$f"); case "$a" in *arm64*) ;; *) echo "NO arm64: $f ($a)"; bad=1;; esac
            fi
          done < <(find "$APP" -type f \( -name "*.so" -o -name "*.dylib" -o -perm -u+x \))
          [ $bad = 0 ] || exit 1
          ditto -c -k --keepParent "$APP" "SPL-Monitor-Mac-AppleSilicon.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: SPL-Monitor-Mac-AppleSilicon
          path: SPL-Monitor-Mac-AppleSilicon.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy PySide6 sounddevice pyinstaller
      - name: Build .exe
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SPLMonitor --collect-data _sounddevice_data spl_monitor.py
          Compress-Archive -Path dist\SPLMonitor.exe -DestinationPath SPL-Monitor-Windows.zip
      - uses: actions/upload-artifact@v5
        with:
          name: SPL-Monitor-Windows
          path: SPL-Monitor-Windows.zip

  release:
    needs: [mac, mac-universal, windows]
    # Publish whatever built, even if one machine type was unavailable.
    # main -> "latest" release; any other branch -> "preview" pre-release (for testing before merge).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: out
          merge-multiple: true
      - name: Publish to the "latest" release
        if: ${{ hashFiles('out/*.zip') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG=latest; TITLE="SPL Monitor (latest build)"; PRE=""
          else
            TAG=preview; TITLE="SPL Monitor PREVIEW (branch $GITHUB_REF_NAME)"; PRE="--prerelease"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" out/*.zip --title "$TITLE" $PRE --target "$GITHUB_SHA" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $GITHUB_REF_NAME. Download the zip for your computer: Mac-AppleSilicon (Universal: runs natively on M1 and newer, and on Intel), Mac-Intel, or Windows."
